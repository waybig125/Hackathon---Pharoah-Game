<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Alchemist's Crypt — System Architecture</title>
<desc>Five-layer architecture: Unity mobile client, FastAPI backend, Gemini 3.1 Flash, Council of Three agentic negotiation, and dual outputs.</desc>
<defs>
